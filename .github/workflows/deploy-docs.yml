name: Deploy Docs to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'apps/docs/**'
      - .github/workflows/deploy-docs.yml
  workflow_dispatch: {}

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy apps/docs to Vercel (prod)
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DOCS }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Vercel Pull
        run: pnpm dlx vercel pull --yes --environment=production --token "$VERCEL_TOKEN" --cwd apps/docs

      - name: Vercel Build
        run: pnpm dlx vercel build --prod --token "$VERCEL_TOKEN" --cwd apps/docs

      - name: Vercel Deploy (prebuilt)
        run: pnpm dlx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" --cwd apps/docs
